name: Сбор данных
# Каждый день в 03:00 UTC: НБУ, DeepState, Prozorro, тревоги → site/data, затем пересборка производных файлов.
on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency: data
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow==10.4.0
      - name: Сбор
        env:
          ALERTS_TOKEN: ${{ secrets.ALERTS_TOKEN }}
        run: python collect.py
      - name: Проверка и сборка
        run: python build_site.py
      - name: Коммит
        run: |
          git config user.name "barometer-bot"
          git config user.email "barometer-bot@users.noreply.github.com"
          git add site/data data
          git diff --cached --quiet || git commit -m "Данные: автосбор $(date -u +%F)"
          git pull --rebase
          git push
