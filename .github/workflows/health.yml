name: Проверка исправности
# Каждый день: если выпуск или данные устарели — открывается Issue (владелец получает уведомление).
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - id: check
        run: |
          set +e
          python health.py > health.txt
          echo "code=$?" >> "$GITHUB_OUTPUT"
          cat health.txt
      - name: Открыть Issue при сбое
        if: steps.check.outputs.code != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Сбой автоматизации: $(date -u +%F)"
          if [ -z "$(gh issue list --label health --state open --json number -q '.[].number')" ]; then
            gh label create health --color B60205 --force >/dev/null 2>&1 || true
            gh issue create --title "$title" --label health --body-file health.txt
          else
            gh issue comment "$(gh issue list --label health --state open --json number -q '.[0].number')" --body-file health.txt
          fi
