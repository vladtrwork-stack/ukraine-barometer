name: Публикация сайта
on:
  push:
    branches: [main]
    paths: ["site/**", "build_site.py", "make_card.py"]
  # Коммиты бота из «Сбора данных» сами не запускают другие workflow — поэтому публикуем по его завершении
  workflow_run:
    workflows: ["Сбор данных", "Автопубликация выпуска"]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency: pages
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow==10.4.0
      - name: Проверка данных (публикация останавливается при ошибке)
        run: python build_site.py
      - name: Карточки для соцсетей (общая и по выпускам)
        run: python make_card.py ru && python make_card.py --all-issues
      - name: PDF-отчёты выпусков
        run: python make_pdf.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
